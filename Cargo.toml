[workspace]
resolver = "2"
members = [
    "crates/ttt-core",
    "crates/ttt-auth",
    "crates/ttt-protocol",
    "crates/ttt-proxy",
    "crates/ttt-control",
    "crates/ttt-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/TalkThatTalk/TalkThatTalk"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.44", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"
pin-project-lite = "0.2"

# HTTP / Zero-Copy Networking
http = "1.3"
http-body = "1.0"
http-body-util = "0.1"
hyper = { version = "1.6", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "tls12", "webpki-tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
bytes = "1.10"
tower-service = "0.3"
leaf = { git = "https://github.com/eycorsican/leaf.git", default-features = false, features = [
    "config-json",
    "inbound-socks",
    "outbound-direct",
    "outbound-socks",
    "outbound-shadowsocks",
    "outbound-trojan",
    "outbound-vmess",
    "outbound-vless",
    "outbound-tls",
    "outbound-ws",
    "outbound-chain",
    "outbound-reality",
    "ring-aead",
    "rustls-tls",
    "rustls-tls-ring",
] }

# Concurrency & Performance
arc-swap = "1.7"
memchr = "2.7"

# Crypto & OAuth
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"
url = "2.5"

# Serialization & Config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }

# Error & Observability
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# Internal crates
ttt-core = { path = "crates/ttt-core" }
ttt-auth = { path = "crates/ttt-auth" }
ttt-protocol = { path = "crates/ttt-protocol" }
ttt-proxy = { path = "crates/ttt-proxy" }
ttt-control = { path = "crates/ttt-control" }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = "symbols"
