[workspace]
resolver = "2"
members = [
    "crates/ttt-core",
    "crates/ttt-auth",
    "crates/ttt-protocol",
    "crates/ttt-proxy",
    "crates/ttt-control",
    "crates/ttt-server",
]

[workspace.package]
version = "0.0.6"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Jlan45/TalkThatTalk"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.44", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"
pin-project-lite = "0.2"

# HTTP / Zero-Copy Networking
http = "1.3"
http-body = "1.0"
http-body-util = "0.1"
hyper = { version = "1.6", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "tls12", "webpki-tokio"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "=0.26.4", default-features = false }
bytes = "1.10"
tower-service = "0.3"
clash-lib = { git = "https://github.com/Watfaq-legacy/clash-rs.git", rev = "2f62452678211746348b97e72fee0e78b8dc1b40", default-features = false, features = ["ring", "shadowsocks"] }

# Concurrency & Performance
arc-swap = "1.7"
memchr = "2.7"
percent-encoding = "2.3"

# Crypto & OAuth
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"
url = "2.5"

# Serialization & Config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
yaml_serde = "0.10"
toml = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }

# Error & Observability
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# Internal crates
ttt-core = { path = "crates/ttt-core" }
ttt-auth = { path = "crates/ttt-auth" }
ttt-protocol = { path = "crates/ttt-protocol" }
ttt-proxy = { path = "crates/ttt-proxy" }
ttt-control = { path = "crates/ttt-control" }

[patch.crates-io]
# ClashRS uses these forks for REALITY.
rustls = { git = "https://github.com/Watfaq/rustls.git", rev = "63d10d50f2308478f366f14f9f81e378f5911e3c" }
tokio-rustls = { git = "https://github.com/Watfaq/tokio-rustls.git", rev = "b26e3e2b7a0161d505fd12d6e545b16463f1a45f" }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = "symbols"
